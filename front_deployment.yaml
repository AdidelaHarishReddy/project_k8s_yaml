apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-project-frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: initcontainer
          image: busybox
          command: ["/bin/sh"]
          args: ["-c", "sleep 10"]
          # volumeMounts:
          #   - name: workdir
          #     mountPath: "home/initcar"
      containers:
        - name: frontend
          image: harishreddy1234/frontend:151
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10  
          # envFrom:
          #        - configMapRef:
          #               name: my-app-config-api-url

